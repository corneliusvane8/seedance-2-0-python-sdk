[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seedance-2-0-python-sdk"
version = "0.2.0"
description = "Community Python SDK and MCP server for the Seedance 2.0 video API (seedance-2.0, -fast, -mini)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28,<3"]
keywords = ["seedance", "seedance-2.0", "bytedance", "text-to-video", "image-to-video", "video-generation", "mcp"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=7"]

[project.scripts]
seedance2-mcp = "seedance_api.mcp_server:main"

[project.urls]
Source = "https://github.com/corneliusvane8/seedance-2-0-python-sdk"

[tool.setuptools]
packages = ["seedance_api"]
